services:
  - type: web
    name: pie-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/migrate.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
