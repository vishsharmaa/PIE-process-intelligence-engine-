processes:
- department: Maintenance
  industry: Manufacturing
  name: Vibration-Based Bearing Failure Prediction
  raw_description: 'Our CNC machining center spindle bearings are monitored with triaxial
    accelerometers sampling at 20kHz. Vibration spectra are collected every 10 minutes
    and stored in an OSIsoft PI historian. Maintenance technicians currently review
    weekly FFT plots manually to look for characteristic bearing defect frequencies
    (BPFO, BPFI, BSF). When anomalies are spotted, a work order is created in SAP
    PM. We want to automate the anomaly detection and work-order generation. Historical
    failure records from the past 3 years are available in the CMMS with tagged root
    causes.

    '
- department: Maintenance
  industry: Manufacturing
  name: Preventive Maintenance Schedule Optimization
  raw_description: 'We run a fleet of 48 injection molding machines. Each machine
    has a manufacturer-recommended preventive maintenance schedule (every 2000 operating
    hours) but actual failure patterns vary significantly by machine age and mold
    complexity. Maintenance is currently scheduled on a fixed calendar regardless
    of machine condition. Downtime records, operating-hour counters, and part-replacement
    logs are tracked in a Maximo CMMS. We want to shift from time-based to condition-based
    PM intervals to reduce unnecessary maintenance while preventing unexpected breakdowns.

    '
- department: Maintenance
  industry: Heavy Industry
  name: Lubrication Management for Rotating Equipment
  raw_description: 'Our plant has over 200 rotating assets (pumps, compressors, gearboxes)
    each with specific lubrication requirements. Lubrication routes are managed on
    paper-based checklists carried by technicians on weekly rounds. Oil analysis samples
    are sent to an external lab with 2-week turnaround. Missed lubrication events
    have caused three major bearing failures this year. We need a system to track
    lube routes digitally, alert on missed tasks, and correlate oil analysis results
    with equipment condition.

    '
- department: Maintenance
  industry: Manufacturing
  name: Electrical Thermography Inspection Program
  raw_description: 'Quarterly thermal imaging inspections of electrical panels, switchgear,
    and motor control centers are performed by a certified thermographer. Images are
    stored as JPEG files on a shared drive with handwritten annotations. Reports are
    created in Word and emailed to the plant manager. Anomalies (hot spots indicating
    loose connections or overloaded circuits) require manual comparison against baseline
    images taken during commissioning. There is no systematic database of thermal
    findings and no trending of temperature changes over time.

    '
- department: Maintenance
  industry: Manufacturing
  name: Compressed Air Leak Detection and Repair
  raw_description: 'Our compressed air system serves the entire production floor with
    3 centrifugal compressors. Energy audits estimate 25-30% of compressed air is
    lost to leaks. Leak surveys are conducted annually by an external contractor using
    ultrasonic detection equipment. Identified leaks are tagged with physical labels
    and added to a spreadsheet. Repair prioritization is ad-hoc based on technician
    availability. We have no continuous monitoring of system pressure or flow rates
    at the zone level to detect new leaks between surveys.

    '
- department: Maintenance
  industry: Mining
  name: Conveyor Belt Condition Monitoring
  raw_description: 'We operate 12 km of conveyor belt systems transporting ore from
    the pit to the processing plant. Belt condition is assessed through monthly visual
    inspections by walking the belt line. Splice failures and belt rips cause 8-12
    hours of unplanned downtime per incident, occurring roughly once per quarter.
    Belt thickness is measured at a few fixed points using ultrasonic gauges during
    planned shutdowns. We are considering installing belt rip detection sensors and
    online thickness monitoring but have no existing digital sensor infrastructure
    on the belts.

    '
- department: Facilities
  industry: Commercial Real Estate
  name: HVAC System Predictive Diagnostics
  raw_description: 'Our building management system (BMS) monitors 24 rooftop HVAC
    units with basic temperature and on/off status sensors. Energy costs for HVAC
    represent 40% of the building''s utility expenses. Currently, HVAC units are serviced
    on quarterly preventive schedules regardless of performance. Tenant comfort complaints
    are logged in a helpdesk system but not correlated with HVAC performance data.
    We have 5 years of BMS trend data stored in a Niagara Framework historian. Refrigerant
    leak detection is manual (visual dye inspection).

    '
- department: Maintenance
  industry: Manufacturing
  name: Crane and Hoist Inspection Compliance
  raw_description: 'We have 15 overhead bridge cranes rated 5-50 tons. OSHA requires
    annual inspections by a qualified person, plus daily pre-use operator checks.
    Inspection results are recorded on paper forms and filed in binders in the maintenance
    office. Finding and retrieving historical inspection records for a specific crane
    requires manual search. Load test certificates, wire rope inspection reports,
    and brake test results must be retained for the life of the equipment. Scheduling
    compliance is tracked on a wall-mounted whiteboard calendar.

    '
- department: Reliability Engineering
  industry: Manufacturing
  name: Motor Current Signature Analysis Program
  raw_description: 'We have identified 45 critical AC induction motors (75-500 HP)
    driving essential production equipment. Motor failures result in production losses
    of $15,000-50,000 per hour. Currently motors are run-to-failure or replaced on
    conservative time-based schedules. We have installed permanent current transformers
    on 20 of these motors and are collecting current waveform data at 10kHz into a
    dedicated server. The remaining 25 motors have no monitoring. We want to implement
    automated MCSA to detect rotor bar defects, eccentricity, and bearing issues before
    catastrophic failure.

    '
- department: Maintenance
  industry: Manufacturing
  name: Spare Parts Criticality Analysis and Stocking
  raw_description: "Our maintenance storeroom carries approximately 8,000 SKUs of\
    \ spare parts worth $2.3 million. Stockout events for critical spares caused 340\
    \ hours of extended downtime last year while waiting for emergency orders. Conversely,\
    \ 35% of inventory has not been used in over 3 years. Parts criticality is not\
    \ formally assessed \u2014 stocking decisions are based on maintenance supervisor\
    \ judgment and historical purchasing habits. We have consumption records in SAP\
    \ MM and equipment BOMs in SAP PM but they are not linked for automated replenishment\
    \ analysis.\n"
